<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f0">
<title>你是哪只神兽？</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:linear-gradient(165deg,#fff8f0 0%,#ffe9d5 55%,#ffdcc2 100%);
  color:#3a2a22;
  display:flex;justify-content:center;
  padding:22px 16px 44px;
}
.wrap{width:100%;max-width:500px}
.panel{
  background:#fff;border-radius:22px;
  padding:24px 20px 26px;
  box-shadow:0 10px 34px rgba(184,110,66,.13);
  border:1px solid rgba(255,255,255,.9);
}
.progress{height:8px;background:#f6e6d6;border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#e8a33d,#c8452f);transition:width .35s ease}
.meta{font-size:13px;color:#a1795c;margin:14px 0 2px;letter-spacing:.03em}
h2{font-size:19.5px;line-height:1.55;margin:6px 0 16px;font-weight:700}
.opt{
  display:block;width:100%;text-align:left;
  padding:15px 16px;margin-bottom:11px;
  border:1.5px solid #f0dcc6;background:#fffdfa;
  border-radius:15px;font-size:15.5px;line-height:1.55;
  color:#3a2a22;cursor:pointer;font-family:inherit;
  transition:border-color .18s,background .18s,box-shadow .18s,transform .1s;
}
.opt:last-child{margin-bottom:0}
.opt:hover{border-color:#e8a33d;background:#fffaf2;box-shadow:0 4px 14px rgba(232,163,61,.16)}
.opt:active{transform:scale(.985)}
.fade{animation:fadeIn .34s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* 首页 */
.intro{text-align:center;padding:14px 4px 6px}
.intro .big{font-size:40px;letter-spacing:.12em;margin-bottom:18px}
.intro h1{font-size:26px;font-weight:800;color:#c8452f;margin-bottom:12px;letter-spacing:.02em}
.intro p{font-size:14.5px;line-height:1.9;color:#7a5c48;margin-bottom:24px}
.btn{
  width:100%;padding:15px;border:none;border-radius:15px;
  background:linear-gradient(135deg,#e8a33d,#c8452f);
  color:#fff;font-size:16.5px;font-weight:600;
  font-family:inherit;cursor:pointer;
  box-shadow:0 8px 20px rgba(200,69,47,.28);
  transition:transform .12s,box-shadow .18s;
}
.btn:active{transform:scale(.98);box-shadow:0 5px 14px rgba(200,69,47,.24)}

/* 结果弹窗 */
.modal{
  position:fixed;inset:0;z-index:50;
  background:rgba(48,26,14,.58);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  padding:18px;
}
.modal.show{display:flex}
.result{
  background:#fff;border-radius:24px;
  width:100%;max-width:390px;max-height:92vh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:26px 22px 22px;text-align:center;
  animation:pop .42s cubic-bezier(.2,1.3,.5,1);
  box-shadow:0 20px 50px rgba(60,30,10,.3);
}
@keyframes pop{from{opacity:0;transform:scale(.86) translateY(16px)}to{opacity:1;transform:none}}
.rimg{width:188px;height:188px;object-fit:contain;display:block;margin:0 auto 6px;filter:drop-shadow(0 10px 18px rgba(200,120,60,.22))}
.rfb{font-size:92px;line-height:1;margin:18px 0 14px}
.badge{display:inline-block;font-size:11.5px;letter-spacing:.16em;color:#b07b2e;background:#fdf2df;border-radius:99px;padding:5px 14px;margin-bottom:12px}
.rname{font-size:27px;font-weight:800;color:#c8452f;letter-spacing:.04em;margin-bottom:5px}
.rtitle{font-size:13.5px;color:#a1795c;letter-spacing:.06em;margin-bottom:16px}
.rdesc{font-size:15px;line-height:1.8;color:#4a362c;text-align:left;margin-bottom:14px}
.quote{
  font-size:13.5px;line-height:1.7;color:#a8762a;
  background:#fdf6ec;border-left:3px solid #e8a33d;
  border-radius:10px;padding:11px 14px;text-align:left;margin-bottom:18px;
}
</style>
</head>
<body>

<div class="wrap"><div class="panel" id="panel"></div></div>

<div class="modal" id="modal">
  <div class="result">
    <img class="rimg" id="rimg" alt="">
    <div class="rfb" id="rfb" style="display:none"></div>
    <div class="badge">你 的 神 兽</div>
    <div class="rname" id="rname"></div>
    <div class="rtitle" id="rtitle"></div>
    <div class="rdesc" id="rdesc"></div>
    <div class="quote" id="rquote"></div>
    <button class="btn" id="againBtn">再测一次</button>
  </div>
</div>

<script>
/* ============ 1. 图片设置 ============
   把图片和 index.html 放在同一个文件夹，文件名必须是：
   aoyu.png  xiaonanshi.png  bianfu.png  luzai.png  jinyu.png
   jiyang.png  qilin.png  xianhe.png  dujiaoshi.png
   找不到图片会自动显示 emoji，不影响使用。
*/
const IMG_PATH = './';
const IMG_EXT  = '.png';

/* ============ 2. 九大神兽文案 ============ */
const BEASTS = {
  aoyu: {
    name:'鳌鱼', emoji:'🐟', title:'热心老大哥',
    desc:'你是那种一有事就第一个站出来的人。群里冷场你要救，朋友吵架你要劝，谁没吃饭你都要问一句。操心操到脚不沾地，但你自己乐在其中。热闹的地方，永远少不了你。',
    quote:'闲不住的热心肠，全世界的事都归你管。'
  },
  xiaonanshi: {
    name:'小南狮', emoji:'🦁', title:'停不下来的活宝',
    desc:'你身上像装了永动机，坐不住、闲不下、静不了。上一秒还在说要去哪玩，下一秒人已经出门了。机灵、皮、反应快，是所有人里最有生命力的那一个。',
    quote:'一刻也闲不住，天生自带 BGM。'
  },
  bianfu: {
    name:'蝙蝠', emoji:'🦇', title:'消息灵通小喇叭',
    desc:'哪里热闹，哪里就有你。你嘴快、耳灵、信息量大，是朋友圈里的情报中心。别人还在疑惑发生了什么，你已经把来龙去脉都搞清楚了。',
    quote:'瓜田里的守望者，八卦界的一线记者。'
  },
  luzai: {
    name:'鹿仔', emoji:'🦌', title:'体面至上主义者',
    desc:'你爱漂亮、讲品味、重细节。衣服要配好，照片要好看，生活要有质感。有点挑剔不是坏事，那是因为你对"好看"这件事有原则。',
    quote:'可以累，但不能丑。'
  },
  jinyu: {
    name:'金鱼', emoji:'🐠', title:'乐天小财迷',
    desc:'你乐观、开朗、脑子转得快，而且满脑子都是发财。红包要抢，优惠要薅，聊三句必提钱。但你不抠，你只是真心热爱"变有钱"这件事。',
    quote:'今天也要元气满满地搞钱！'
  },
  jiyang: {
    name:'吉羊', emoji:'🐑', title:'憨憨干饭王',
    desc:'你脾气好、心宽、憨厚，最大的爱好是吃。天大的事，先吃顿饭再说。别人焦虑到失眠，你在认真思考夜宵吃什么。',
    quote:'天塌下来，也得先吃完这碗饭。'
  },
  qilin: {
    name:'麒麟', emoji:'🦄', title:'靠谱定海神针',
    desc:'你是团队里永远清醒的那个人。大家聊嗨了、跑偏了、闹起来了，你一句话就能把话题拉回来。认真、稳重、有分寸，是所有人默认的靠谱担当。',
    quote:'全场唯一还记得正事的人。'
  },
  xianhe: {
    name:'仙鹤', emoji:'🦢', title:'温柔读心师',
    desc:'你温和、细腻、共情力强。别人一个眼神，你就知道对方今天不太对劲。你不抢话、不争锋，但你是那个最让人安心的存在。',
    quote:'最懂人心的那一个，总是先照顾别人的情绪。'
  },
  dujiaoshi: {
    name:'独角狮', emoji:'🐯', title:'高冷远方派',
    desc:'你话不多，看上去有点冷，还嘴硬。你习惯站在高处看事情，不轻易表态，但心里一直有个声音在说"我想去更远的地方"。你不是不在乎，你只是不轻易表现出来。',
    quote:'嘴硬心软，心里装着一整片远方。'
  }
};

/* ============ 3. 十道题 ============ */
const QUESTIONS = [
  { q:'周五晚上突然空出来，你会——',
    opts:[
      { t:'喊上一群人组局，顺便问问谁没来',            s:{aoyu:2, bianfu:1} },
      { t:'冲出去打球、骑车、逛街，反正不能闲着',        s:{xiaonanshi:2, dujiaoshi:1} },
      { t:'窝在家点一份最想吃的外卖，慢慢享受',          s:{jiyang:2, jinyu:1} }
    ]},
  { q:'朋友发来一条大瓜，你的第一反应是——',
    opts:[
      { t:'立刻追问细节，再顺手转给三个人',            s:{bianfu:2, aoyu:1} },
      { t:'先分辨真假，提醒朋友别乱传',                s:{qilin:2, dujiaoshi:1} },
      { t:'关心当事人心情，想想怎么安慰',              s:{xianhe:2, luzai:1} }
    ]},
  { q:'出门前，你花最多时间在——',
    opts:[
      { t:'挑衣服、照镜子、整理头发',                  s:{luzai:2, xiaonanshi:1} },
      { t:'检查手机、钥匙、钱包、充电宝',              s:{aoyu:2, qilin:1} },
      { t:'盘算今天能不能顺手赚点或省点',              s:{jinyu:2, jiyang:1} }
    ]},
  { q:'群里有人发红包，你会——',
    opts:[
      { t:'手速第一，抢完还要晒一下',                  s:{jinyu:2, xiaonanshi:1} },
      { t:'先看看谁抢最多，再分析一波',                s:{bianfu:2, aoyu:1} },
      { t:'不抢，但会问一句大家最近怎么样',            s:{xianhe:2, luzai:1} }
    ]},
  { q:'朋友遇到麻烦，你的第一反应是——',
    opts:[
      { t:'立刻问"要不要我过去"，然后开始安排',        s:{aoyu:2, xiaonanshi:1} },
      { t:'先冷静听完，再帮他理清楚',                  s:{qilin:2, xianhe:1} },
      { t:'嘴上说"这有什么大不了"，其实已经在查办法',  s:{dujiaoshi:2, luzai:1} }
    ]},
  { q:'吃饭这件事，你最像——',
    opts:[
      { t:'吃到好吃的能开心一整天，还要加个甜品',      s:{jiyang:2, jinyu:1} },
      { t:'挑店挑菜挑环境，不合心意会直说',            s:{luzai:2, dujiaoshi:1} },
      { t:'边吃边聊，顺便把最近的瓜全讲了',            s:{bianfu:2, xiaonanshi:1} }
    ]},
  { q:'一个人待着的时候，你通常在想——',
    opts:[
      { t:'什么时候能去一个很远的地方',                s:{dujiaoshi:2, xianhe:1} },
      { t:'今天有没有什么事没做好',                    s:{qilin:2, aoyu:1} },
      { t:'下一顿吃什么，下个月怎么多赚点',            s:{jiyang:2, jinyu:1} }
    ]},
  { q:'别人夸你，哪句话最让你舒服——',
    opts:[
      { t:'"你今天真好看 / 真有品味"',                  s:{luzai:2, jinyu:1} },
      { t:'"你真靠谱，有你在就放心"',                   s:{qilin:2, aoyu:1} },
      { t:'"你真有意思，跟你在一起不无聊"',             s:{xiaonanshi:2, bianfu:1} }
    ]},
  { q:'遇到不公平的事，你会——',
    opts:[
      { t:'当场就说，憋不住',                          s:{xiaonanshi:2, bianfu:1} },
      { t:'表面不动声色，心里记着',                    s:{dujiaoshi:2, luzai:1} },
      { t:'先稳住大家的情绪，再想办法',                s:{xianhe:2, aoyu:1} }
    ]},
  { q:'如果给你一个愿望，你选——',
    opts:[
      { t:'财源滚滚，想买什么就买什么',                s:{jinyu:2, jiyang:1} },
      { t:'身边的人平安开心',                          s:{xianhe:2, qilin:1} },
      { t:'自由自在，想去哪就去哪',                    s:{dujiaoshi:2, xiaonanshi:1} }
    ]}
];

/* ============ 4. 逻辑 ============ */
const panel = document.getElementById('panel');
const modal = document.getElementById('modal');
let idx = 0;
const scores = {};
Object.keys(BEASTS).forEach(k => scores[k] = 0);

function flash(){
  panel.classList.remove('fade');
  void panel.offsetWidth;
  panel.classList.add('fade');
}

function renderStart(){
  panel.innerHTML = `
    <div class="intro">
      <div class="big">🐟 🦁 🦇 🦌 🐠</div>
      <h1>你是哪只神兽？</h1>
      <p>十道题，测出你最像九大神兽里的哪一只<br>
      鳌鱼 · 小南狮 · 蝙蝠 · 鹿仔 · 金鱼<br>
      吉羊 · 麒麟 · 仙鹤 · 独角狮</p>
      <button class="btn" id="startBtn">开始测试</button>
    </div>`;
  document.getElementById('startBtn').onclick = start;
  flash();
}

function start(){
  idx = 0;
  Object.keys(scores).forEach(k => scores[k] = 0);
  modal.classList.remove('show');
  document.body.style.overflow = '';
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[idx];
  panel.innerHTML = `
    <div class="progress"><div class="bar" style="width:${idx / QUESTIONS.length * 100}%"></div></div>
    <div class="meta">第 ${idx + 1} / ${QUESTIONS.length} 题</div>
    <h2>${q.q}</h2>
    <div id="optBox"></div>`;
  const box = document.getElementById('optBox');
  q.opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = o.t;
    b.onclick = () => pick(o.s);
    box.appendChild(b);
  });
  flash();
}

function pick(s){
  for (const k in s) scores[k] += s[k];
  idx++;
  if (idx < QUESTIONS.length){
    renderQuestion();
  } else {
    const bar = panel.querySelector('.bar');
    if (bar) bar.style.width = '100%';
    setTimeout(showResult, 340);
  }
}

function showResult(){
  let best = null, bestScore = -1;
  for (const k in scores){
    if (scores[k] > bestScore){ bestScore = scores[k]; best = k; }
  }
  const b = BEASTS[best];

  document.getElementById('rname').textContent  = b.name;
  document.getElementById('rtitle').textContent = b.title;
  document.getElementById('rdesc').textContent  = b.desc;
  document.getElementById('rquote').textContent = b.quote;

  const img = document.getElementById('rimg');
  const fb  = document.getElementById('rfb');
  fb.textContent = b.emoji;
  fb.style.display = 'none';
  img.style.display = 'block';
  img.onerror = function(){
    this.style.display = 'none';
    fb.style.display = 'block';
  };
  img.src = IMG_PATH + best + IMG_EXT;

  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}

document.getElementById('againBtn').onclick = start;

renderStart();
</script>
</body>
</html>
